schema_version: "1.0"
workflow:
  id: "desapp-thinflow"
  name: "DesApp ThinFlow delivery"
  version: "3.0.0"
  author: "Alquimistas"
  description: "Prepare one outcome contract, build once, check by risk, evaluate once, and publish"
requires:
  speckit_version: ">=1.0.0"
  integrations:
    any: ["codex", "opencode"]
inputs:
  spec: {type: string, required: true}
  integration: {type: string, default: "auto"}
steps:
  - id: outcome_ready
    type: shell
    run: "python3 scripts/thinflow.py prepare $AGENTFLOW_TASK_ID"
    output_format: json

  - id: develop
    type: prompt
    integration: "{{ inputs.integration }}"
    timeout: 3600
    prompt: |
      Agentflow stage: develop
      You are the single accountable builder for $AGENTFLOW_TASK_ID. Read the
      active backlog task, its compact spec.md, current human feedback,
      AGENTS.md, docs/PRODUCT.md, docs/ARCHITECTURE.md, docs/CHECKPOINTS.md,
      docs/WORKFLOW_LESSONS.md, and the constitution. Do not inspect workflow
      run directories or unrelated feature artifacts.

      First make the compact outcome spec concrete: keep only Outcome,
      Acceptance, Scope, Non-goals, Risk, and material Decisions. If an
      unresolved choice materially changes behavior, scope, permissions,
      security, data integrity, or an expensive irreversible design, stop with
      a precise question; do not invent a decision. Otherwise implement the
      smallest coherent slice, including tests for every behavior change.
      Keep domain, web, persistence, and external adapters separated.

      Use focused tests while iterating. Do not run the full regression suite,
      create plan.md/tasks.md/research/data-model/quickstart/handoffs, change
      workflow policy to make a product check pass, commit, push, open a PR, or
      merge. ThinFlow deterministically selects and runs required local checks
      after this session. Finish with the workspace in a reviewable state.

  - id: candidate_ready
    type: shell
    timeout: 3600
    run: "python3 scripts/thinflow.py check $AGENTFLOW_TASK_ID"
    output_format: json

  - id: qa
    type: prompt
    integration: "{{ inputs.integration }}"
    timeout: 2400
    prompt: |
      Agentflow stage: qa
      Act as the one independent evaluator for $AGENTFLOW_TASK_ID. You did not
      implement the candidate. Read the compact spec.md, task, current feedback,
      REVIEW.md, diff, implementation, and the local ThinFlow selection/check
      receipt. Do not inspect workflow logs, trust summaries, modify
      implementation, invoke another agent, or rerun the full suite by default.

      Evaluate every acceptance item, the selected risk tier, architecture and
      security boundaries, regression scope, and the integrity of deterministic
      check evidence. Run only a targeted check needed to resolve a concrete
      discrepancy or uncovered risk and explain it. Validate each surprising
      finding against code or runnable evidence before reporting it. On a repair
      pass, review the repair delta and affected surfaces; do not repeat resolved
      or pre-existing findings. Write evaluation.md in the active feature with a
      concise acceptance/evidence matrix, blocking findings, advisory findings,
      and residual risks. Only blocking findings may produce `Verdict: FAIL`.
      End exactly with `Verdict: PASS` only when the candidate is ready for CI
      and human merge; otherwise end exactly with `Verdict: FAIL` and actionable
      findings grouped by root-cause class.

  - id: qa_ready
    type: shell
    run: "python3 scripts/thinflow.py evaluate $AGENTFLOW_TASK_ID"
    output_format: json
