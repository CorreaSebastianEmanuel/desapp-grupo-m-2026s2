schema_version: "1.0"
workflow:
  id: "desapp-delivery"
  name: "DesApp autonomous SDD delivery"
  version: "1.0.0"
  author: "Alquimistas"
  description: "Specify, plan, implement, converge, and independently verify one task"
requires:
  speckit_version: ">=1.0.0"
  integrations:
    any: ["codex"]
inputs:
  spec: {type: string, required: true}
  integration: {type: string, default: "auto"}
steps:
  - id: product
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}\n\nAfter the specification is written, create handoffs/product.md inside the active feature directory with decisions, assumptions, open questions, evidence, and guidance for the architect."
  - id: architecture
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "Read the active spec, handoffs/product.md, and all human feedback included in the workflow input. Read docs/ARCHITECTURE.md. Design the smallest compliant solution and record durable deviations as ADRs. Create handoffs/architecture.md with decisions, assumptions, risks, evidence, and guidance for implementation."
  - id: checklist
    command: speckit.checklist
    integration: "{{ inputs.integration }}"
    input:
      args: "Read existing handoffs and human feedback. Check product invariants, checkpoint coverage, testability, security, and failure behavior. Create handoffs/checklist.md with findings and unresolved questions."
  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "Read the spec, plan, checklist, existing handoffs, and human feedback. Order work test-first where practical; include docs and verification. Create handoffs/tasks.md with sequencing decisions and implementation guidance."
  - id: analyze
    command: speckit.analyze
    integration: "{{ inputs.integration }}"
    input:
      args: "Read all existing handoffs and human feedback. Check alignment with PRODUCT, ARCHITECTURE, CHECKPOINTS, spec, plan, and tasks; fix critical inconsistencies. Create handoffs/analyze.md with changes, remaining risks, and evidence."
  - id: develop
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "Read spec.md, plan.md, tasks.md, all existing handoffs, and human feedback before coding. Implement and run all applicable checks. Create handoffs/develop.md with changes, decisions, commands and results, risks, and exact guidance for QA. Do not commit, push, create a PR, or merge; Agentflow publishes only after verification."
  - id: converge
    command: speckit.converge
    integration: "{{ inputs.integration }}"
    input: {args: "Read all handoffs and human feedback. Independently find acceptance gaps and append concrete remaining tasks. Create handoffs/converge.md with gaps and required remediation."}
  - id: remediate
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input: {args: "Read all handoffs and human feedback. Complete only remaining convergence tasks and rerun checks. Create handoffs/remediate.md with fixes and fresh test evidence."}
  - id: qa
    type: prompt
    integration: "{{ inputs.integration }}"
    timeout: 1200
    prompt: |
      Act as independent QA. Do not invoke agentflow, its verify skill, or another agent. Do not trust summaries or modify implementation code. Locate the active feature; read spec.md, plan.md, tasks.md, every handoff, all human feedback, and the diff. Run applicable checks directly and verify every acceptance criterion with evidence. Write qa-report.md and handoffs/qa.md in the feature directory. End exactly with `Verdict: PASS` only if everything passes; otherwise `Verdict: FAIL` with blockers.
  - id: review
    type: prompt
    integration: "{{ inputs.integration }}"
    timeout: 1200
    prompt: |
      Act as final independent reviewer. Do not invoke agentflow, its verify skill, or another agent, and do not modify implementation code. Inspect the active specification, architecture, every handoff, all human feedback, QA report, diff, security, checkpoint coverage, and evidence directly. Write review-report.md and handoffs/review.md in the feature directory. End exactly with `Verdict: PASS` only when ready for human merge; otherwise `Verdict: FAIL` with blockers.
