name: CP1 acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cp1-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_market_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MIX_ENV: test
      DATABASE_URL: ecto://postgres:postgres@localhost/football_market_test
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: erlef/setup-beam@v1
        with:
          otp-version: 29.0.6
          elixir-version: 1.20.3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/openapi/package-lock.json
      - name: Prepare locked dependencies
        run: |
          ./scripts/check_toolchain.sh --with-node
          mix local.hex --if-missing --force
          mix local.rebar --if-missing --force
          mix deps.get --locked
          MIX_ENV=test mix deps.compile
          npm ci --prefix tools/openapi
          tools/openapi/node_modules/.bin/playwright-core install --with-deps --only-shell chromium
      - name: Quality, profiles, and coverage
        run: |
          mix format --check-formatted
          MIX_ENV=test mix compile --warnings-as-errors
          scripts/ci_unit_tests.sh
          mix test.unit
          mix test.integration
          mix test.cp1_coverage
      - name: Acceptance tooling contracts
        run: |
          export CP1_REAL_COVERAGE_DIRECTORY="$(python3 -c 'from pathlib import Path; paths = list(Path("cover/cp1").glob("*/manifest.json")); assert len(paths) == 1; print(paths[0].parent)')"
          python3 -m unittest test/ci/cp1_acceptance_test.py
          MIX_ENV=test mix test test/ci/cp1_demo_contract_test.exs test/ci/cp1_workflow_contract_test.exs
      - name: Demonstrate twice without retained child streams
        env:
          CP1_DEMO_CONFIRM_DISPOSABLE: yes
          CP1_DEMO_DATABASE_URL: ecto://postgres:postgres@localhost/football_market_test_cp1_demo
          CP1_CANDIDATE_SHA: ${{ github.sha }}
          PGPASSWORD: postgres
        run: |
          createdb -h localhost -U postgres football_market_test_cp1_demo
          scripts/cp1_demo.sh tmp/cp1-demo-first.json
          scripts/cp1_demo.sh tmp/cp1-demo-second.json
      - name: Validate and scan local receipts before upload
        run: >-
          python3 scripts/cp1_acceptance.py stage-local
          --candidate-sha ${{ github.sha }}
          --local-evidence .
          --output tmp/cp1-sanitized-local
      - uses: actions/upload-artifact@v4
        with:
          name: cp1-local-receipts-${{ github.sha }}
          if-no-files-found: error
          path: tmp/cp1-sanitized-local/
          retention-days: 90

  acceptance:
    needs: verify
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cp1-local-receipts-${{ github.sha }}
          path: tmp/local-receipts
      - name: Collect completed same-SHA terminal evidence
        id: collect
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
          GOVERNING_REF: refs/heads/main
          QUALITY_WORKFLOW: quality-baseline.yml
          SONAR_WORKFLOW: sonarcloud.yml
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set +x
          mkdir -p .cp1-private-receipts
          python3 scripts/cp1_hosted_receipts.py \
            --candidate "$CANDIDATE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF" \
            --github-api "$GITHUB_API_URL" \
            --output .cp1-private-receipts/receipts.json
      - name: Evaluate exact revision
        id: evaluate
        continue-on-error: true
        run: >-
          python3 scripts/cp1_acceptance.py
          --receipts .cp1-private-receipts/receipts.json
          --output cp1-acceptance-${{ github.sha }}
          --candidate-sha ${{ github.sha }}
          --local-evidence tmp/local-receipts
      - name: Publish safe acceptance artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp1-acceptance-${{ github.sha }}
          path: |
            cp1-acceptance-${{ github.sha }}/
          if-no-files-found: error
          retention-days: 90
      - name: Add navigation summary
        if: always()
        run: |
          if [ -f cp1-acceptance-${{ github.sha }}/acceptance.md ]; then
            cat cp1-acceptance-${{ github.sha }}/acceptance.md >> "$GITHUB_STEP_SUMMARY"
          else
            printf '%s\n' '## CP1 acceptance: NOT PASSING' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Enforce result
        if: steps.evaluate.outcome != 'success'
        run: exit 1
