name: Quality baseline

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality-baseline:
    name: Quality baseline
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_market_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install exact BEAM toolchain
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.3'
          otp-version: '29.0.6'

      - name: Verify exact toolchain
        run: ./scripts/check_toolchain.sh

      - name: Restore locked dependency cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-29.0.6-elixir-1.20.3-${{ hashFiles('mix.lock') }}

      - name: Install package managers
        run: |
          mix local.hex --if-missing --force
          mix local.rebar --if-missing --force

      - name: Fetch locked dependencies
        run: mix deps.get --locked

      - name: Compile dependencies
        run: MIX_ENV=test mix deps.compile

      - name: Credo and source inventory
        id: credo
        run: sh scripts/credo_ci.sh

      - name: Sobelow security analysis
        id: sobelow
        run: |
          python3 scripts/sobelow_ci.py
          python3 -m unittest discover -s test/scripts -p sobelow_ci_test.py

      - name: Identify compatible Dialyzer cache
        id: dialyzer-cache
        run: echo "key=$(python3 scripts/dialyzer_ci.py cache-key)" >> "$GITHUB_OUTPUT"

      - name: Restore exact Dialyzer PLTs
        id: dialyzer-plts
        uses: actions/cache@v4
        with:
          path: tmp/dialyzer/
          key: ${{ steps.dialyzer-cache.outputs.key }}

      - name: Required Dialyzer model and application analysis
        id: dialyzer
        env:
          DIALYZER_CACHE_HIT: ${{ steps.dialyzer-plts.outputs.cache-hit }}
        run: |
          python3 scripts/dialyzer_ci.py
          python3 -m unittest discover -s test/scripts -p dialyzer_ci_test.py

      - name: Formatting
        run: mix format --check-formatted

      - name: Warnings-as-errors
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Install Node test toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/openapi/package-lock.json

      - name: Install OpenAPI test dependencies
        run: npm ci --prefix tools/openapi

      - name: Install headless Chromium
        run: tools/openapi/node_modules/.bin/playwright-core install --with-deps chromium

      - name: Validate OpenAPI contract
        run: |
          node tools/openapi/validate.mjs priv/static/openapi.json

      - name: Docker Compose readiness
        run: |
          docker info >/dev/null
          docker compose version

      - name: Build browser assets
        run: MIX_ENV=test mix assets.build

      - name: Prepare test database
        run: MIX_ENV=test mix test.prepare

      - name: Unit tests
        id: application-coverage
        env:
          CI_PROFILE_RECEIPTS: tmp/profile-ci
        run: python3 scripts/application_coverage.py run

      - name: Workflow behavior tests
        id: profile-receipt-verification
        run: python3 scripts/test_profile_components.py verify-receipts tmp/profile-ci

      - name: Upload Credo evidence
        id: upload-credo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credo-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: tmp/credo-ci/
          retention-days: 14
          if-no-files-found: error

      - name: Upload Sobelow evidence
        id: upload-sobelow
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sobelow-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: tmp/sobelow-ci/
          retention-days: 14
          if-no-files-found: error

      - name: Upload Dialyzer evidence
        id: upload-dialyzer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dialyzer-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: tmp/dialyzer-ci/
          retention-days: 14
          if-no-files-found: error

      - name: Upload TASK-067 application coverage
        id: upload-coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: application-coverage-${{ github.event.pull_request.head.sha || github.sha }}-attempt-${{ github.run_attempt }}
          path: cover/application/
          retention-days: 14
          if-no-files-found: error

      - name: Publish quality summary
        if: always()
        env:
          QUALITY_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
          CREDO_OUTCOME: ${{ steps.credo.outcome }}
          CREDO_ARTIFACT_URL: ${{ steps.upload-credo.outputs.artifact-url }}
          CREDO_ARTIFACT_OUTCOME: ${{ steps.upload-credo.outcome }}
          SOBELOW_OUTCOME: ${{ steps.sobelow.outcome }}
          SOBELOW_ARTIFACT_URL: ${{ steps.upload-sobelow.outputs.artifact-url }}
          SOBELOW_ARTIFACT_OUTCOME: ${{ steps.upload-sobelow.outcome }}
          DIALYZER_OUTCOME: ${{ steps.dialyzer.outcome }}
          DIALYZER_ARTIFACT_URL: ${{ steps.upload-dialyzer.outputs.artifact-url }}
          DIALYZER_ARTIFACT_OUTCOME: ${{ steps.upload-dialyzer.outcome }}
          APPLICATION_COVERAGE_OUTCOME: ${{ steps.application-coverage.outcome }}
          COVERAGE_ARTIFACT_URL: ${{ steps.upload-coverage.outputs.artifact-url }}
          COVERAGE_ARTIFACT_OUTCOME: ${{ steps.upload-coverage.outcome }}
          UNIT_OUTCOME: ${{ steps.application-coverage.outcome }}
          PROFILE_RECEIPTS_OUTCOME: ${{ steps.profile-receipt-verification.outcome }}
        run: python3 scripts/quality_summary.py

  end-to-end:
    name: End-to-end profile
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.6-alpine@sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: football_market_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d football_market_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.2.1-alpine@sha256:987c376c727652f99625c7d205a1cba3cb2c53b92b0b62aade2bd48ee1593232
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out triggering revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Install exact BEAM toolchain
        uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.20.3'
          otp-version: '29.0.6'

      - name: Verify exact toolchain
        run: ./scripts/check_toolchain.sh

      - name: Restore locked dependency cache
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp-29.0.6-elixir-1.20.3-${{ hashFiles('mix.lock') }}

      - name: Install package managers
        run: |
          mix local.hex --if-missing --force
          mix local.rebar --if-missing --force

      - name: Fetch locked dependencies
        run: mix deps.get --locked

      - name: Compile dependencies
        run: MIX_ENV=test mix deps.compile

      - name: Formatting
        run: mix format --check-formatted

      - name: Warnings-as-errors
        run: MIX_ENV=test mix compile --warnings-as-errors

      - name: Install Node test toolchain
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/openapi/package-lock.json

      - name: Install OpenAPI test dependencies
        run: npm ci --prefix tools/openapi

      - name: Install headless Chromium
        run: tools/openapi/node_modules/.bin/playwright-core install --with-deps chromium

      - name: Validate OpenAPI contract
        run: |
          node tools/openapi/validate.mjs priv/static/openapi.json

      - name: Build browser assets
        run: MIX_ENV=test mix assets.build

      - name: End-to-end journeys
        run: |
          MIX_ENV=test mix test.prepare
          MIX_ENV=test sh scripts/test_profile.sh e2e

      - name: Safe runtime outcome
        if: always()
        run: echo 'E2E runtime check finished; inspect the profile outcome above'

  sonarcloud:
    name: SonarCloud
    uses: ./.github/workflows/sonarcloud.yml
    secrets: inherit

  thinflow-required:
    name: ThinFlow required
    if: always()
    needs: [quality-baseline, end-to-end, sonarcloud]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every constituent gate
        env:
          QUALITY_RESULT: ${{ needs.quality-baseline.result }}
          E2E_RESULT: ${{ needs.end-to-end.result }}
          SONAR_RESULT: ${{ needs.sonarcloud.result }}
        shell: bash
        run: |
          printf 'Quality baseline: %s\nEnd-to-end profile: %s\nSonarCloud: %s\n' \
            "$QUALITY_RESULT" "$E2E_RESULT" "$SONAR_RESULT"
          [[ "$QUALITY_RESULT" == success ]]
          [[ "$E2E_RESULT" == success ]]
          [[ "$SONAR_RESULT" == success ]]
      - name: Summarize exact-head required checks
        if: always()
        env:
          QUALITY_RESULT: ${{ needs.quality-baseline.result }}
          E2E_RESULT: ${{ needs.end-to-end.result }}
          SONAR_RESULT: ${{ needs.sonarcloud.result }}
          QUALITY_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          {
            printf '## ThinFlow required\n\nRevision: `%s`\n\n' "$QUALITY_REVISION"
            printf '| Required context | Exact-head outcome |\n| --- | --- |\n'
            printf '| `Quality baseline` | %s |\n| `End-to-end profile` | %s |\n| `SonarCloud` | %s |\n' \
              "$QUALITY_RESULT" "$E2E_RESULT" "$SONAR_RESULT"
            printf '\nThe aggregate succeeds only when all three contexts succeed.\n'
          } >> "$GITHUB_STEP_SUMMARY"
