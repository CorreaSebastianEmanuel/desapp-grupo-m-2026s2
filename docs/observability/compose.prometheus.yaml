name: football_market_prometheus_demo

services:
  prometheus:
    image: prom/prometheus:v3.2.1
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../tmp/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../tmp/prometheus/metrics-token:/run/secrets/football-market-metrics-token:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=24h"
