name: football_market_sonarqube_local

services:
  sonar-elixir-plugin-init:
    image: curlimages/curl:8.12.1
    user: "0:0"
    volumes:
      - sonarqube_extensions:/opt/sonarqube/extensions
    command:
      - sh
      - -ec
      - |
        mkdir -p /opt/sonarqube/extensions/plugins
        jar="/opt/sonarqube/extensions/plugins/sonar-elixir-plugin-0.1.1.jar"
        if [ ! -s "$$jar" ]; then
          curl -fsSL "https://github.com/hpopp/sonar-elixir/releases/download/v0.1.1/sonar-elixir-plugin-0.1.1.jar" -o "$$jar"
        fi
        chown -R 1000:0 /opt/sonarqube/extensions/plugins

  sonarqube:
    image: sonarqube:community
    depends_on:
      sonar-elixir-plugin-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${SONARQUBE_PORT:-9000}:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions

volumes:
  sonarqube_data:
    name: football_market_sonarqube_data
  sonarqube_logs:
    name: football_market_sonarqube_logs
  sonarqube_extensions:
    name: football_market_sonarqube_extensions
